<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fullscreen Blurred Menu — полноэкранное навигационное меню с эффектом размытия и анимациями текста на GSAP."
    />
    <title>Fullscreen Blurred Menu</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"
      defer
    ></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="header-logo">
        <a href="#">Obscura</a>
      </div>

      <button
        type="button"
        class="menu-toggle"
        aria-expanded="false"
        aria-controls="menu"
      >
        menu
      </button>

      <nav class="menu" id="menu" aria-label="Основное меню" inert>
        <div class="menu-bg"></div>

        <a class="menu-item" href="#">
          <span class="item-index">01</span>
          <span class="item-label">Work</span>
          <span class="item-divider" aria-hidden="true"></span>
        </a>
        <a class="menu-item" href="#">
          <span class="item-index">02</span>
          <span class="item-label">Portfolio</span>
          <span class="item-divider" aria-hidden="true"></span>
        </a>
        <a class="menu-item" href="#">
          <span class="item-index">03</span>
          <span class="item-label">Retrospective</span>
          <span class="item-divider" aria-hidden="true"></span>
        </a>
        <a class="menu-item" href="#">
          <span class="item-index">04</span>
          <span class="item-label">Lens</span>
          <span class="item-divider" aria-hidden="true"></span>
        </a>
        <a class="menu-item" href="#">
          <span class="item-index">05</span>
          <span class="item-label">Selected</span>
          <span class="item-divider" aria-hidden="true"></span>
        </a>
        <a class="menu-item" href="#">
          <span class="item-index">06</span>
          <span class="item-label">Enquire</span>
          <span class="item-divider" aria-hidden="true"></span>
        </a>
      </nav>
    </header>

    <main>
      <section class="hero"></section>
    </main>
  </body>
</html>
